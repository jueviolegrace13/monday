# Render blueprint — free tier only (approved 2026-10-15). Connect this repo in Render to deploy.
services:
  - type: web
    name: monday
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ConnectionStrings__Monday   # Neon connection string (free tier)
        sync: false
      - key: Monday__Agent__Self         # Monday watches its own traffic
        value: "true"
      - key: Monday__Agent__ApiKey       # issued for Monday's own project after the first deploy
        sync: false
      - key: Monday__Agent__UserHashKey
        sync: false
      - key: MONDAY_SECRETS_KEY          # master key that seals model API keys; base64 of 32 random bytes
        sync: false
